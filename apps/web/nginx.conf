# =============================================================================
# Nginx config baked into the web production image
# =============================================================================
# THE LISTEN PORT IS 5173 ON PURPOSE, AND IT IS NOT THE VITE DEV SERVER.
#
# This container is only ever reached from inside the compose network, by the
# proxy in infra/nginx/nginx.conf, whose `web_upstream` names `web:5173`. The
# port number is therefore arbitrary — nothing outside the network connects to
# it — and it is matched to the dev server's port so that ONE proxy config
# serves both modes.
#
# The alternative is a separate proxy config per mode, which means two copies
# of the SSE block, the security headers and the CSP, drifting apart the first
# time one of them is edited.
#
# Before "correcting" this to 80: `base.compose.yml + prod.compose.yml` used to
# have exactly that mismatch, and the result was a stack whose API answered
# normally while every page load returned 502.
# =============================================================================

server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker and its registration script must NOT be cached
    # (issue #218). Exact-match locations, which nginx evaluates ahead of the
    # regex block below — without them `sw.js` matches `\.(js|...)$` and is
    # served `immutable, max-age=31536000`.
    #
    # That is exactly wrong for this one file. The browser re-fetches the
    # worker script to discover updates, and a response it is told is immutable
    # for a year is a deploy the user may never receive: the app keeps serving
    # the precached shell of whatever revision first installed. The spec caps
    # the worker script's own freshness at 24h, so this is a stale-for-a-day
    # bug rather than a permanent one — but a day is still long enough for a
    # push-notification fix to look like it did not ship, and Firefox has
    # historically honoured `immutable` more literally than that cap.
    #
    # Everything the worker precaches is content-hashed (`assets/index-<hash>.js`)
    # and stays immutable below; it is only the two unhashed entry points that
    # need revalidating.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    # The web app manifest must NOT be cached (per PWA best practice).
    # Browsers revalidate it to discover app config changes.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
