<?xml version="1.0" encoding="UTF-8"?>
<!--
  The same K-AND-WAVEFORM MARK as `icons/source.svg` (issue #146) -- a white K
  of one stem and two round-capped diagonal arms, followed by five amber bars
  whose first two nestle into the K's mouth -- on a 32 canvas with the tighter
  favicon crop (mark width 80% of the canvas instead of 68%): at tab size the
  padding costs whole pixels, and the arms and bars need them to stay legible.
  `favicon.ico`'s frames use the identical crop, so the vector and raster
  favicons agree.

  TWO DESCRIPTIONS, ONE MARK. `apps/web/scripts/generate-icons.py` draws this
  geometry in Pillow and deliberately does NOT rasterise this file, because
  rendering an SVG needs a toolchain (rsvg / cairosvg / a headless browser)
  this template refuses to require of a fork's CI. So the mark is described
  three times -- here, in `icons/source.svg`, and in that script -- and all
  three must be edited together. `src/__tests__/pwa/brandMark.test.ts` compares
  the two SVGs in NORMALISED mark space rather than by a raw scale factor,
  because the two crops differ (0.80 here, 0.68 there) and a 512/32 comparison
  would therefore fail on two files that agree perfectly about the shape.

  Geometry, on a 32 canvas (mark width 0.80 x 32 = 25.6, height 18.89):
    stroke 3.338 wide, cap radius 1.669; stem x 3.200, y 6.554, height 18.893;
    junction (4.869, 16.000); arm ends x 16.110, y 9.009 and 22.991; bars
    width 2.140, pitch 3.031, first at x 14.536, all centred on y 16.000.

  Kept deliberately terse -- no comments inside the markup, no metadata, no
  editor cruft -- because this is served on every page load.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7.04" fill="#4f46e5"/>
  <g fill="#fff">
    <rect x="3.200" y="6.554" width="3.338" height="18.893" rx="1.669"/>
  </g>
  <g stroke="#fff" stroke-width="3.338" stroke-linecap="round" fill="none">
    <line x1="4.869" y1="16.000" x2="16.110" y2="9.009"/>
    <line x1="4.869" y1="16.000" x2="16.110" y2="22.991"/>
  </g>
  <g fill="#fbbf24">
    <rect x="14.536" y="13.686" width="2.140" height="4.628" rx="1.070"/>
    <rect x="17.567" y="11.717" width="2.140" height="8.566" rx="1.070"/>
    <rect x="20.598" y="12.332" width="2.140" height="7.337" rx="1.070"/>
    <rect x="23.629" y="11.717" width="2.140" height="8.566" rx="1.070"/>
    <rect x="26.660" y="13.686" width="2.140" height="4.628" rx="1.070"/>
  </g>
</svg>
