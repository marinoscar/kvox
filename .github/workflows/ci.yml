name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# WHY THE SLOW SUITES ARE SHARDED ACROSS RUNNERS — read before merging jobs
# =============================================================================
# Wall clock is the longest job, so the work that dominated it is split across
# runners instead of running serially on one. Measured on `main` runs of
# 2026-10-15 (before the split), per step:
#
#   `npm test --workspace=api`       7.5-8.4 min  (was inside `Build & Test`)
#   `test:db --workspace=api`        2.8-4.5 min  (was inside `smoke`)
#   web Vitest, per shard of 4       1.5-2.7 min
#   everything else                  under 1 min per step
#
# That made the workflow 9-13 min, set by the API suite and the visual run.
# The API suite is now `api-test` (4 shards) and
# `test:db` is `db-test` (2 shards), the same shape `web-test` already had.
# The visual regression job was removed from CI (its suite and the manual
# `visual-baselines.yml` workflow remain). Typecheck, the CLI suite and the
# CLI build stay together in `Build & Test`.
#
# Measured on PR #514 (same commit, 4 API shards, no queueing on the re-run):
# 4m55s wall clock, down from 9m27s-12m01s. The API shards are still the
# critical path (3m07s-4m00s of tests, ~4m50s per job). Two things that did NOT
# help, so do not retry them without new evidence:
#   - A persisted Jest cache (actions/cache on --cacheDirectory): it restored
#     fine but held only ~11 MB, and the same 123-suite shard took 126s cold
#     and 205s warm. ts-jest compile is not the bottleneck; running the ~40
#     integration suites that boot the whole AppModule (20-35s each) is.
#   - A 4th shard on its own: total test time stayed ~13-14 min, so shards
#     divide the wall clock but not the work. Shard run-to-run noise is large
#     (+-1 min for the same files), so compare per-step times over several runs.
# Runs also queue when other PRs' CI is active: the account's concurrent-job
# cap is shared, and this workflow now fans out to 13 jobs.
#
# Two earlier findings still hold:
#   - Splitting typecheck/CLI into their own job was measured slower (71-95s
#     inside one job, 118-131s in a fresh one — a warm page cache from npm ci).
#     They stay together; only the long suites are split.
#   - Every shard repeats `npm ci` (~35s) and runner startup. Past ~4 shards of
#     one suite the fixed cost eats the gain, and the job count matters: GitHub
#     caps concurrent jobs per plan, so a second run in flight (push + PR) would
#     queue behind this one. Count the matrix legs before adding a shard.
#
# Required status checks: shard legs are separate check names (for example
# `API Tests (shard 1/4)`). If branch protection pins check names, update it.
# =============================================================================

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # The API and the web import @marinoscar/kvox-contract from its built
      # output (dist/, git-ignored): build it right after the install (issue #488).
      - run: npm run build --workspace=@marinoscar/kvox-contract
      # The web also imports @marinoscar/kvox-web (core, transcription) from its built output (issue #499).
      - run: npm run build --workspace=@marinoscar/kvox-web
      # The API also imports @marinoscar/kvox-api (ports, core) from its built output (issue #490).
      - run: npm run build --workspace=@marinoscar/kvox-api
      # ...and @marinoscar/kvox-ai (the model mechanics, issue #579), built after kvox-api.
      - run: npm run build --workspace=@marinoscar/kvox-ai
      # ...and @marinoscar/kvox-eval (the kg and Ask evaluation, issue #580), built after kvox-ai:
      # the kg:eval and ask:eval scripts and their specs import it.
      - run: npm run build --workspace=@marinoscar/kvox-eval

      - run: npx prisma generate
        working-directory: apps/api

      # `shellcheck` lints apps/cli/bootstrap-vps.sh two steps below (issue
      # #130). ubuntu-latest (24.04 "noble") ships ShellCheck 0.9.0 from apt;
      # the script is written to pass `-S warning` on that version. (ffmpeg is
      # installed by `api-test`, the only job that runs it.)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck

      # bootstrap-vps.sh is fetched with curl and run on a fresh VPS before
      # anything in this repository is built, so nothing else in CI would ever
      # execute it. `bash -n` is the syntax check; shellcheck at warning level
      # is the lint. Its `--dry-run` output is asserted against a committed
      # fixture by `apps/cli/src/bootstrap-vps.test.ts` in the CLI test run.
      - run: bash -n apps/cli/bootstrap-vps.sh
      - run: shellcheck -S warning apps/cli/bootstrap-vps.sh

      - run: npm run typecheck --workspace=api
      - run: npm run typecheck --workspace=web
      - run: npm run typecheck --workspace=cli
      - run: npm run typecheck --workspace=@app/shared
      # infra/ is rendered from @marinoscar/platform-infra by `npm run
      # platform:infra:sync`: fail when a generated compose/nginx/env file was
      # edited by hand or the package was bumped without a re-sync (issue #483).
      # The app's own differences live in infra/compose/app.*.compose.yml,
      # infra/compose/app.env.example and infra/nginx/app.d/ (never checked).
      - run: npm run platform:infra:sync -- --check
      # @app/shared/ontology is a thin re-export of @marinoscar/kvox-contract/ontology
      # (issue #488): the committed files under packages/shared/ontology/ are two
      # hand-written stubs. `build:ontology` now builds the contract; fail if a
      # build touched the committed stubs or someone re-committed compiled output.
      - run: npm run build:ontology --workspace=@app/shared && git diff --exit-code -- packages/shared/ontology

      # The API unit suite runs in `api-test` below, sharded.
      # Knowledge-graph golden set self-test (issue #362): scores predictions
      # synthesised from the labels, so anything but 1.000 is a scorer or
      # fixture bug. Report-only — CI never passes --enforce (spec §6: the
      # targets gate relaxing resolution thresholds, not shipping).
      - run: npm run kg:eval --workspace=api -- --predictions gold
      - run: npm run test:run --workspace=cli

      # The CLI is the one workspace whose BUILD is the deliverable — the `bin`
      # points at dist/, so a package that typechecks but does not emit is
      # broken for every user while looking green here. Cheap (tsc only) and it
      # catches the ESM footguns this package is exposed to: a missing `.js`
      # import extension, or a rootDir slip that emits dist/src/cli.js and
      # leaves the `bin` path dangling. (issue #140, epic #110)
      - run: npm run build --workspace=cli

  api-test:
    name: API Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # No `needs:` — runs concurrently with `build`. Split out of `Build & Test`
    # because this suite alone was 7.5-8.4 min (see the note atop this file).
    # `jest --shard` splits by test FILE.
    env:
      NODE_ENV: test
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      # `media.audio.transcode` (epic #19, issue #26) runs ffprobe and ffmpeg,
      # and `media-audio-transcode.ffmpeg.spec.ts` deliberately has NO skip
      # guard — a suite that skips itself when a binary is missing is the only
      # proof in this repository that the playback rendition is really seekable
      # (`+faststart` is a flag ffmpeg accepts and silently ignores on a
      # non-seekable output), and proof that skips is not proof. Both container
      # images install the same package; this is the runner's copy of that.
      # Every shard installs it because the file that needs it may land in any.
      #
      # The apt install runs in the background WHILE `npm ci` runs: it was a
      # 24-28s serial step on every shard, and the two share no resources worth
      # contending for. `wait` returns apt's exit status, so a failed install
      # still fails this step (GitHub runs bash with `-e`).
      - name: Install ffmpeg (background) and dependencies
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg) &
          apt_pid=$!
          npm ci
          (cd apps/api && npx prisma generate)
          wait "$apt_pid"

      # The API and the web import @marinoscar/kvox-contract from its built
      # output (dist/, git-ignored): build it right after the install (issue #488).
      - run: npm run build --workspace=@marinoscar/kvox-contract
      # The API also imports @marinoscar/kvox-api (ports, core) from its built output (issue #490).
      - run: npm run build --workspace=@marinoscar/kvox-api
      # ...and @marinoscar/kvox-ai (the model mechanics, issue #579), built after kvox-api.
      - run: npm run build --workspace=@marinoscar/kvox-ai
      # ...and @marinoscar/kvox-eval (the kg and Ask evaluation, issue #580), built after kvox-ai:
      # the kg:eval and ask:eval scripts and their specs import it.
      - run: npm run build --workspace=@marinoscar/kvox-eval

      - run: npm test --workspace=api -- --shard=${{ matrix.shard }}/4

  # Repository tooling for the platform adoption (epic #457, issue #461): the
  # pinned @marinoscar/platform-* packages, one copy of every singleton, no
  # app code reaching into a package's src/dist, and the @marinoscar/kvox-*
  # packages (issue #487: build, typecheck, test; the docs, peers, pack and
  # smoke-import checks run in kvox-packages.yml). No `needs:` — runs
  # concurrently.
  tooling:
    name: Repository tooling
    runs-on: ubuntu-latest
    steps:
      # Full history: `changeset status` finds where HEAD diverged from `main`.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      # The transcripts slice's `media-audio-transcode.ffmpeg.spec.ts` runs a real
      # ffmpeg with no skip guard (see the api-test job); it lives in the package
      # now, so the job that runs the package tests installs it too.
      - name: Install ffmpeg (background) and dependencies
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg) &
          apt_pid=$!
          npm ci
          wait "$apt_pid"

      - run: npm run check:platform-pin
      - run: node scripts/check-platform-pin.mjs --self-test
      - run: npm run check:single-instance
      - run: npm run check:platform-imports
      - run: npm run lint:packages
      - run: npm run build:packages
      - run: npm run typecheck:packages
      - run: npm run test:packages
      # The domain fragments and migrations live in packages/kvox-db (issue
      # #489) and reach the app as installed copies. The composed schema equals
      # a fresh compose, and `db:check` runs `platform db check` and then
      # `kvox-db check`: every generated fragment and installed migration is
      # byte-identical to the package (prisma/kvox.lock), and the raw-SQL index
      # list is merged into platform.lock. Needs the package built (above).
      - run: npm run db:compose:check --workspace=api
      - run: npm run db:check --workspace=api
      # A PR checkout has no local `main` branch, which `changeset status`
      # diffs against (`baseBranch` in .changeset/config.json). When `main`
      # itself is checked out (a push to main) the branch already exists.
      - run: git fetch origin main && (git branch --force main origin/main || true)
      # The version pull request that kvox-release.yml opens consumes the
      # changesets, so it has none left to find.
      - if: github.head_ref != 'kvox-release/version'
        run: npx changeset status

  web-test:
    name: Web Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # No `needs:` — runs concurrently with `build`, like `openapi` and
    # `smoke` do. Split out of `Build & Test` and sharded across 4 runners
    # (see the note atop this file) because this suite alone now costs more
    # wall clock than every other job in the workflow combined, and each
    # shard gets its own runner's CPUs rather than contending with
    # typecheck/API-test on one. This job needs neither `prisma generate`
    # nor any API build step — the web workspace never imports
    # `@prisma/client` or compiled API output.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # The API and the web import @marinoscar/kvox-contract from its built
      # output (dist/, git-ignored): build it right after the install (issue #488).
      - run: npm run build --workspace=@marinoscar/kvox-contract
      # The web also imports @marinoscar/kvox-web (core, transcription) from its built output (issue #499).
      - run: npm run build --workspace=@marinoscar/kvox-web

      - run: npm run test:run --workspace=web -- --shard=${{ matrix.shard }}/4

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    # No `needs:` — this reads decorator metadata only and shares nothing with
    # the build job, so it runs concurrently rather than queueing behind it.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # The API and the web import @marinoscar/kvox-contract from its built
      # output (dist/, git-ignored): build it right after the install (issue #488).
      - run: npm run build --workspace=@marinoscar/kvox-contract
      # The API also imports @marinoscar/kvox-api (ports, core) from its built output (issue #490).
      - run: npm run build --workspace=@marinoscar/kvox-api
      # ...and @marinoscar/kvox-ai (the model mechanics, issue #579), built after kvox-api.
      - run: npm run build --workspace=@marinoscar/kvox-ai

      # The dump imports AppModule, which imports @prisma/client. Preview mode
      # never instantiates PrismaService, but the generated client still has to
      # exist for the import to resolve.
      - run: npx prisma generate
        working-directory: apps/api

      - run: npm run openapi:typecheck --workspace=api

      # Boots the app in Nest preview mode: every module loaded and every
      # controller's metadata read, no provider instantiated — so no database,
      # no object storage and no credentials are needed here.
      - run: npm run openapi:dump

      - run: npm run openapi:lint

  smoke:
    name: Smoke (boot compiled API)
    runs-on: ubuntu-latest
    # No `needs:` — runs concurrently with `build`, like `openapi` does.
    #
    # WHY THIS IS A SEPARATE JOB, given the note at the top of this file
    # -------------------------------------------------------------------------
    # That note records a measured result: moving typecheck/API-test work into
    # its own job made it slower (71-95s -> 118-131s), plausibly from losing a
    # page cache the earlier steps had warmed. It is a real finding, and the
    # default for that work should be one job. This job is the deliberate
    # exception, because the measurement does not transfer:
    #
    #   - That split duplicated `npm ci` to run *the same* work somewhere else,
    #     so its cost was pure overhead. This job runs work that exists nowhere
    #     in CI today — `nest build`, `migrate deploy`, `db seed`, and booting
    #     the artifact — so the comparison is not "same work, colder cache".
    #   - Running concurrently, its cost to total wall clock is
    #     max(build, smoke), not build + smoke. Appending these steps to
    #     `Build & Test` would instead extend the longest job on the critical
    #     path by the full build-plus-boot time.
    #   - The dominant costs here are compilation and waiting on Postgres and
    #     on bootstrap. Only the first is filesystem-bound, so the specific
    #     effect the note measured has much less to bite on.
    #
    # There is also a correctness reason not to fold this into `Build & Test`:
    # that job sets `NODE_ENV: test` for the whole job, while this one must run
    # the artifact with `NODE_ENV=production` — the mode that actually deploys,
    # and the only one in which `app.module.ts` leaves `TestAuthModule` out.
    # A service container is job-scoped too, so folding it in would start
    # Postgres for every unit-test run that has no use for it.
    #
    # If the assumption above turns out to be wrong, the thing to measure is
    # total workflow wall clock, not this job's own duration.
    services:
      postgres:
        # Matches infra/compose/test.compose.yml, which is the only Postgres
        # image this repo pins (base.compose.yml expects an external database
        # and declares no `db` service).
        #
        # pgvector, not plain postgres (issue #178, epic #165): `vector` is a
        # server-side control file, and `CREATE EXTENSION vector` in the
        # semantic-search migration fails without one. That failure lands inside
        # `prisma migrate deploy` in the `smoke` job, so on a plain image this
        # workflow would go red ON THE MIGRATION rather than on a test.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The API never reads DATABASE_URL from the environment — it builds the
      # connection string from these at runtime (src/config/configuration.ts,
      # src/prisma/prisma.service.ts) and the Prisma CLI does the same via
      # scripts/prisma-env.js. Setting the POSTGRES_* variables is therefore
      # what exercises the contract the application actually has.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
      POSTGRES_SSL: 'false'
      # Obviously-fake values. GOOGLE_CLIENT_ID is the one that is genuinely
      # mandatory: GoogleStrategy passes it straight to passport-google-oauth20,
      # which throws `OAuth2Strategy requires a clientID option` on an empty
      # string and takes bootstrap down with it. The rest are supplied because a
      # real deployment has them, not because bootstrap fails without them.
      JWT_SECRET: smoke-test-jwt-secret-not-a-real-secret-0000
      COOKIE_SECRET: smoke-test-cookie-secret-not-a-real-secret
      GOOGLE_CLIENT_ID: smoke-test-google-client-id
      GOOGLE_CLIENT_SECRET: smoke-test-google-client-secret
      GOOGLE_CALLBACK_URL: http://127.0.0.1:3001/api/auth/google/callback
      INITIAL_ADMIN_EMAIL: smoke-admin@example.test
      OTEL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      # NODE_ENV is deliberately left unset for the install and build steps:
      # `npm ci` skips devDependencies under NODE_ENV=production, which would
      # remove @nestjs/cli (the build), the Prisma CLI (migrations) and ts-node
      # (the seed). Only the final step runs as production.
      - run: npm ci

      # The API and the web import @marinoscar/kvox-contract from its built
      # output (dist/, git-ignored): build it right after the install (issue #488).
      - run: npm run build --workspace=@marinoscar/kvox-contract
      # The API also imports @marinoscar/kvox-api (ports, core) from its built output (issue #490).
      - run: npm run build --workspace=@marinoscar/kvox-api
      # ...and @marinoscar/kvox-ai (the model mechanics, issue #579), built after kvox-api.
      - run: npm run build --workspace=@marinoscar/kvox-ai

      - run: npx prisma generate
        working-directory: apps/api

      # The point of this job: the smoke test runs `dist/main.js`, the same
      # artifact the Dockerfile runs, rather than a Test.createTestingModule
      # stand-in that never executes main.ts.
      - run: npm run build --workspace=api

      # First time migrations and seeding run against a real database in CI.
      # Both were previously exercised only by hand, which is how #56 (broken
      # seeding) stayed hidden. These two steps — not the smoke test's readiness
      # check — are what actually verify the schema: the readiness indicator
      # issues a `SELECT 1`, which passes against an empty database, whereas the
      # seed writes real rows and fails on a schema that does not match.
      - run: npm run prisma:migrate --workspace=api

      - run: npm run prisma:seed --workspace=api

      # And again (#256, epic #254). Every write in prisma/seed.ts is an upsert
      # keyed on a natural unique — role.name, permission.name,
      # rolePermission.roleId_permissionId, systemSettings.key — so a second run
      # must update the same rows rather than fail on a unique constraint or
      # duplicate a grant. That is not a hypothetical property: `kvox deploy
      # update` re-runs the seed on every upgrade, and it is how new permissions
      # reach an existing database. A seed that is not idempotent therefore
      # breaks on the SECOND deployment, in production, and never here. This
      # step is the difference, and it costs a few seconds.
      #
      # The data's own self-consistency (no duplicate declarations, no role
      # granting a permission that is not seeded, the seeded system-settings
      # blob still equal to the API's defaults) is asserted without a database
      # by apps/api/test/prisma/seed-data.spec.ts.
      - run: npm run prisma:seed --workspace=api

      # Boots the compiled app and asserts it serves /api/health/live,
      # /api/health/ready and a valid /api/openapi.json. See the header of
      # apps/api/scripts/smoke-test.mjs for what each assertion is protecting —
      # in particular why a 200 on the OpenAPI document, and not merely a
      # successful boot, is the assertion that matters.
      - run: npm run smoke --workspace=api
        env:
          NODE_ENV: production
          SMOKE_PORT: '3001'

  db-test:
    name: DB Tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # No `needs:` — runs concurrently with `build`. Split out of `smoke`, where
    # it cost 2.8-4.5 min of a ~6 min job and sat on the critical path.
    #
    # Each shard has its OWN Postgres service container, so `--runInBand` (the
    # suites share one cluster and must not overlap) still holds per shard, and
    # the shards cannot interfere with each other.
    #
    # The database password is derived from the run id, attempt and shard rather
    # than written as a literal: the container is throwaway and only reachable
    # from this runner, but a fixed, well-known password in the file is what
    # secret scanners flag as a hardcoded credential. It must match in both
    # places below (the service and the job `env`).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        # Matches infra/compose/test.compose.yml, which is the only Postgres
        # image this repo pins (base.compose.yml expects an external database
        # and declares no `db` service).
        #
        # pgvector, not plain postgres (issue #178, epic #165): `vector` is a
        # server-side control file, and `CREATE EXTENSION vector` in the
        # semantic-search migration fails without one. That failure lands inside
        # `prisma migrate deploy` in the `smoke` and `db-test` jobs, so on a plain image this
        # workflow would go red ON THE MIGRATION rather than on a test.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ format('ci-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.shard) }}
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The API builds its connection string from these at runtime, the same
      # contract `smoke` exercises (see the comment on its `env:`).
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${{ format('ci-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.shard) }}
      POSTGRES_DB: appdb
      POSTGRES_SSL: 'false'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # The API and the web import @marinoscar/kvox-contract from its built
      # output (dist/, git-ignored): build it right after the install (issue #488).
      - run: npm run build --workspace=@marinoscar/kvox-contract
      # The API also imports @marinoscar/kvox-api (ports, core) from its built output (issue #490).
      - run: npm run build --workspace=@marinoscar/kvox-api
      # ...and @marinoscar/kvox-ai (the model mechanics, issue #579), built after kvox-api.
      - run: npm run build --workspace=@marinoscar/kvox-ai
      # ...and @marinoscar/kvox-eval (the kg and Ask evaluation, issue #580), built after kvox-ai:
      # the kg:eval and ask:eval scripts and their specs import it.
      - run: npm run build --workspace=@marinoscar/kvox-eval

      - run: npx prisma generate
        working-directory: apps/api

      # The one place (with `smoke`) in CI a real Postgres is up: `*.db.spec.ts`
      # (job-schema index/constraint assertions, see apps/api/test/jobs/) are
      # excluded from every other `npm test`/`test:unit`/`test:cov`/`test:ci`
      # run precisely because no Postgres is reachable there, and would
      # otherwise fail with a confusing connection error rather than a clear
      # skip. The migration has to have actually run for the hand-written
      # indexes and constraints these suites check to exist at all, and the
      # database is unseeded, as it was when this ran inside `smoke`.
      - run: npm run prisma:migrate --workspace=api

      # NODE_ENV=test matches what these specs assume when they build their own
      # connection string from the POSTGRES_* vars above.
      - run: npm run test:db --workspace=api -- --shard=${{ matrix.shard }}/2
        env:
          NODE_ENV: test

      # The kvox-db package applies the platform history and then the domain
      # history (installed under `stable` names) to a database of its own, then runs
      # `kvox-db check --database` (issue #489). It creates and drops that
      # database next to the one named here, so it runs on one shard only.
      - if: matrix.shard == 1
        run: npm run test:run --workspace=@marinoscar/kvox-db -- apply.db
        env:
          DATABASE_URL: ${{ format('postgres://postgres:ci-{0}-{1}-{2}@127.0.0.1:5432/postgres', github.run_id, github.run_attempt, matrix.shard) }}

      # The kvox-api real-database tier (issue #492): the test host composes the
      # platform and domain schema (`kvox-db sync --names stable`), generates
      # its own client and migrates a database of its own per spec file next to
      # the one named here, so it too runs on one shard only. `test:host:prepare`
      # needs the `kvox-db` bin, which runs from its built output.
      - if: matrix.shard == 1
        run: npm run build --workspace=@marinoscar/kvox-db
      - if: matrix.shard == 1
        run: npm run test:host:prepare --workspace=@marinoscar/kvox-api
      - if: matrix.shard == 1
        run: npm run test:db --workspace=@marinoscar/kvox-api
        env:
          DATABASE_URL: ${{ format('postgres://postgres:ci-{0}-{1}-{2}@127.0.0.1:5432/postgres', github.run_id, github.run_attempt, matrix.shard) }}
