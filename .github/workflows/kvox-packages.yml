name: KVox packages

# Build, check and pack the six publishable packages (@marinoscar/kvox-contract,
# -db, -ai, -api, -web, -eval). Publishing is kvox-release.yml's job. The standard these
# jobs enforce: docs/PACKAGES.md.
#
# The `bare-host` job is the consumer proof: it installs the PACKED tarballs into
# a project outside the repository (examples/bare-host), with no platform-api,
# and runs the domain end to end on two databases. It needs the build job first.
#
# `ci.yml` also runs build/typecheck/test of the packages in its `tooling` job
# on every pull request; this workflow adds the checks that only matter when a
# package changes (docs, peers, pack, smoke imports) and runs on the paths below.

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/kvox-*/**'
      - 'packages/kvox-*.json'
      - 'scripts/kvox-packages/**'
      - 'scripts/check-single-instance.mjs'
      - '.changeset/**'
      - 'eslint.config.mjs'
      - 'typedoc.base.json'
      - 'tsdoc.json'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/api/package.json'
      - 'apps/web/package.json'
      - 'examples/bare-host/**'
      - '.github/workflows/kvox-packages.yml'
  push:
    branches: [main]
    paths:
      - 'packages/kvox-*/**'
      - 'packages/kvox-*.json'
      - 'scripts/kvox-packages/**'
      - 'scripts/check-single-instance.mjs'
      - '.changeset/**'
      - 'eslint.config.mjs'
      - 'typedoc.base.json'
      - 'tsdoc.json'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/api/package.json'
      - 'apps/web/package.json'
      - 'examples/bare-host/**'
      - '.github/workflows/kvox-packages.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, check and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      # The transcripts slice's real-ffmpeg spec has no skip guard (see ci.yml).
      - name: Install ffmpeg (background) and dependencies
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg) &
          apt_pid=$!
          npm ci
          wait "$apt_pid"

      - run: npm run build:kvox-packages
      - run: npm run typecheck:kvox-packages
      - run: npm run lint:packages
      # Rules graph, peers-data, manifest, imports and host-neutral for the
      # packages, then app-installs for the two apps that depend on them.
      - run: npm run check:kvox-slice-peers
      # The brand identity file is in step with packages/shared/identity.json, and
      # apps/web/public mirrors the package's brand assets byte for byte (issue #628).
      - run: npm run check:kvox-brand
      # The check scripts themselves, against fixtures (including a file that
      # breaks the host-neutral rule).
      - run: npm run test:kvox-scripts
      - run: npm run test:kvox-packages
      # Asks npm what each package would publish and compares it with the
      # manifest. Needs the build above.
      - run: npm run check:kvox-pack
      # Installs kvox-ai alone with its peers into an empty project and asserts
      # @marinoscar/platform-api is not in the tree (issue #578). Needs the build
      # above and the registry.
      - run: npm run check:kvox-lean-install

      # Every entry point must load from the module system it advertises. The
      # packages resolve through the workspace links `npm ci` created.
      - name: Smoke-import every entry point
        run: |
          node -e "require('@marinoscar/kvox-api/core')"
          node -e "require('@marinoscar/kvox-api/ports')"
          node -e "require('@marinoscar/kvox-api/testing')"
          node -e "require('@marinoscar/kvox-api/transcription')"
          node -e "require('@marinoscar/kvox-api/transcription/testing')"
          node -e "require('@marinoscar/kvox-api/search')"
          node -e "require('@marinoscar/kvox-api/search/testing')"
          node -e "require('@marinoscar/kvox-db')"
          node -e "require('@marinoscar/kvox-ai')"
          node -e "require('@marinoscar/kvox-eval')"
          node -e "require('@marinoscar/kvox-eval/fixtures')"
          node -e "require('@marinoscar/kvox-eval/parity')"
          node packages/kvox-eval/dist/cli/main.js kg --predictions gold --only m01
          node -e "require('@marinoscar/kvox-eval/ask-run')"
          node packages/kvox-eval/dist/cli/main.js ask --replay --out "$RUNNER_TEMP/ask-replay"
          node -e "require('@marinoscar/kvox-contract')"
          node -e "require('@marinoscar/kvox-contract/graph')"
          node -e "require('@marinoscar/kvox-contract/ontology')"
          node -e "require('@marinoscar/kvox-contract/schemas/transcript-export.v1.json')"
          node --input-type=module -e "await import('@marinoscar/kvox-contract')"
          node --input-type=module -e "await import('@marinoscar/kvox-contract/transcripts')"
          node --input-type=module -e "await import('@marinoscar/kvox-contract/errors')"
          node --input-type=module -e "await import('@marinoscar/kvox-web/core/headless')"
          node --input-type=module -e "await import('@marinoscar/kvox-web/transcription/headless')"
          node packages/kvox-db/bin/kvox-db.js --help

  package-docs:
    name: Package docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # kvox-api's slices import the contract's built subpaths, kvox-ai
      # imports kvox-api's (`@marinoscar/kvox-api/ports`, `/testing`), and
      # kvox-eval imports kvox-ai's (`createKvoxAi`, `createDirectRuntime`).
      - run: npm run build -w @marinoscar/kvox-contract -w @marinoscar/kvox-api -w @marinoscar/kvox-ai

      # TypeDoc for the six packages (fails on an undocumented export or a
      # broken {@link}), then README, TSDoc tag and entry-point checks.
      - run: npm run check:kvox-package-docs

      - uses: actions/upload-artifact@v4
        with:
          name: kvox-api-reference
          path: packages/*/docs-api/html
          if-no-files-found: error

  single-instance:
    name: Single instance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: node scripts/kvox-packages/check-single-instance.mjs --root . --guard '@marinoscar/platform-*' --guard '@marinoscar/kvox-*'

  changeset-status:
    name: Changeset status
    # A pull request that changes a package source needs a changeset. The
    # version pull request that kvox-release.yml opens consumes the changesets
    # and is the one exception.
    if: github.event_name == 'pull_request' && github.head_ref != 'kvox-release/version'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: git fetch origin main
      - run: npx changeset status --since=origin/main

  bare-host:
    name: Bare host (${{ matrix.db }})
    # A host that is not the web edition: stub ports, an embedded PostgreSQL and
    # NO @marinoscar/platform-api, installed from the packed tarballs in a
    # directory outside the repository. What a workspace link would hide (a file
    # missing from `files`, a dev-only dependency, a wrong `exports` condition, a
    # duplicated singleton, an optional peer that is really required) fails here.
    # examples/bare-host/README.md describes what it proves.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        db: [service, pglite]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      # Only the `service` leg needs a server; PGlite runs inside the test process.
      # A plain `docker run` instead of `services:` because a service container
      # cannot be switched on per matrix entry.
      - name: Start PostgreSQL with pgvector
        if: matrix.db == 'service'
        run: |
          docker run -d --name kvox-pg -e POSTGRES_PASSWORD=pg -p 5433:5432 pgvector/pgvector:pg16
          for attempt in $(seq 1 30); do
            docker exec kvox-pg pg_isready -U postgres && exit 0
            sleep 2
          done
          docker logs kvox-pg
          exit 1

      - run: npm ci

      - run: npm run build:kvox-packages

      - name: Pack the three packages the host installs
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          for package in contract db api; do
            npm pack -w "@marinoscar/kvox-$package" --pack-destination "$RUNNER_TEMP/tarballs"
          done

      - name: Run the bare host
        env:
          DATABASE_URL: postgresql://postgres:pg@127.0.0.1:5433/postgres
        run: node examples/bare-host/run.mjs --from tarballs "$RUNNER_TEMP/tarballs" --db ${{ matrix.db }}
