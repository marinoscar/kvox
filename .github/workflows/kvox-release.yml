name: KVox release

# Versions and publishes @marinoscar/kvox-{contract,db,ai,api,web,eval} as one fixed
# group. Modelled on the EnterpriseAppBase release workflow (jobs version,
# gate, publish, publish-dry-run), without its image and GitHub-release jobs:
# the application images keep their own deploy.yml flow.
#
#   push to main with pending changesets
#       -> version: opens or updates the "kvox-release/version" pull request
#          (changeset version + lockfile refresh).
#   push to main with no pending changeset (the version pull request merged)
#       -> gate: reads the version, asks the registry whether it is published
#          and whether the six names exist.
#       -> publish          when NPM_PUBLISH_ENABLED is "true" and the gate is ready
#       -> publish-dry-run  otherwise: builds, packs and uploads the six tarballs
#
# NO NPM TOKEN ANYWHERE. `publish` authenticates with OIDC trusted publishing
# (id-token: write, from the protected environment `npm-publish`) and publishes
# with provenance. The gate runs without credentials and treats any registry
# error as "not ready", so a misconfiguration selects the dry run and never
# publishes half a release. `--tag latest` is never passed: a pre-release goes
# to the dist-tag in .changeset/pre.json (`next`).
#
# Owner setup (one time) and rollback: docs/runbooks/release-kvox-packages.md.

on:
  push:
    branches: [main]
    paths:
      - 'packages/kvox-*/**'
      - '.changeset/**'
      - 'scripts/kvox-packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/kvox-release.yml'
  workflow_dispatch:

concurrency:
  group: kvox-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The six packages, in publish order (the contract first: the others peer on it;
  # ai before api and web, which will bind it; eval last, it peers on ai and api).
  KVOX_PACKAGES: 'contract db ai api web eval'

jobs:
  version:
    name: Version pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pending: ${{ steps.pending.outputs.count }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Count pending changesets
        id: pending
        run: |
          # In pre mode `changeset version` leaves the consumed changesets in
          # place and lists them in pre.json, so only the unlisted ones are pending.
          count=$(node -e "
            const fs = require('fs');
            let consumed = [];
            try { consumed = JSON.parse(fs.readFileSync('.changeset/pre.json', 'utf8')).changesets; } catch {}
            const pending = fs.readdirSync('.changeset')
              .filter((f) => f.endsWith('.md') && f !== 'README.md')
              .filter((f) => !consumed.includes(f.slice(0, -3)));
            console.log(pending.length);
          ")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "pending changesets: $count"

      - name: Open or update the version pull request
        if: steps.pending.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C kvox-release/version
          npm run version-packages
          git add -A
          if git diff --cached --quiet; then
            echo "changeset version produced no change: nothing to open"
            exit 0
          fi
          git commit -m 'chore(infra): version kvox packages'
          git push --force origin kvox-release/version
          body='Generated by `kvox-release.yml` from the pending changesets (`changeset version`). Merging it publishes the six `@marinoscar/kvox-*` packages (or runs the dry run when `NPM_PUBLISH_ENABLED` is not `true`). Procedure: docs/runbooks/release-kvox-packages.md.'
          if gh pr view kvox-release/version --json number > /dev/null 2>&1; then
            gh pr edit kvox-release/version --body "$body"
          else
            gh pr create --base main --head kvox-release/version \
              --title 'chore(infra): version kvox packages' --body "$body"
          fi

  gate:
    name: Release gate
    needs: version
    if: needs.version.outputs.pending == '0'
    runs-on: ubuntu-latest
    # No credentials: read-only token, public registry queries only.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
      publish: ${{ steps.gate.outputs.publish }}
      dry_run: ${{ steps.gate.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Decide
        id: gate
        env:
          NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: |
          version=$(node -p "require('./packages/kvox-api/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          publish=false
          dry_run=false

          # 0.0.0 is the unversioned source; there is nothing to release yet.
          if [ "$version" = "0.0.0" ]; then
            echo "version is 0.0.0 (no version pull request merged yet): nothing to release"
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "dry_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The six packages must share the version (the fixed group).
          for p in $KVOX_PACKAGES; do
            v=$(node -p "require('./packages/kvox-$p/package.json').version")
            if [ "$v" != "$version" ]; then
              echo "::error::@marinoscar/kvox-$p is $v but kvox-api is $version; the fixed group is out of step"
              exit 1
            fi
          done

          ready=true
          published=0
          for p in $KVOX_PACKAGES; do
            name="@marinoscar/kvox-$p"
            # 1. Does the name exist on the registry? (Trusted publishing can only
            #    be attached to a name that exists; the runbook bootstraps them.)
            if out=$(npm view "$name" name 2>&1); then
              :
            elif echo "$out" | grep -q 'E404'; then
              echo "::warning::$name does not exist on npm yet (bootstrap not done): dry run only"
              ready=false
              continue
            else
              echo "::warning::registry error for $name, treating the release as not ready: $out"
              ready=false
              continue
            fi
            # 2. Is this version already published?
            if out=$(npm view "$name@$version" version 2>&1); then
              echo "$name@$version is already published"
              published=$((published + 1))
            elif echo "$out" | grep -q 'E404'; then
              echo "$name@$version is not published yet"
            else
              echo "::warning::registry error for $name@$version, treating the release as not ready: $out"
              ready=false
            fi
          done

          total=$(echo $KVOX_PACKAGES | wc -w)
          if [ "$published" -eq "$total" ]; then
            echo "all $total packages are already at $version: nothing to do"
          elif [ "$published" -ne 0 ]; then
            # A previous publish stopped half way. The publish job skips the
            # packages already at this version, so a re-run finishes the rest.
            echo "::warning::$published of $total packages are already published at $version; publishing the rest"
            if [ "$NPM_PUBLISH_ENABLED" = "true" ] && [ "$ready" = "true" ]; then publish=true; else dry_run=true; fi
          elif [ "$NPM_PUBLISH_ENABLED" = "true" ] && [ "$ready" = "true" ]; then
            publish=true
          else
            dry_run=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          {
            echo "### Release gate"
            echo "- version: \`$version\`"
            echo "- NPM_PUBLISH_ENABLED: \`${NPM_PUBLISH_ENABLED:-unset}\`"
            echo "- registry ready: \`$ready\`"
            echo "- result: publish=\`$publish\`, dry_run=\`$dry_run\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to npm
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Required reviewer, main only (repository settings). The only job with
    # id-token: write, and the only one that can push a tag.
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g 'npm@^11.5.1'

      - run: npm ci

      - run: npm run build:kvox-packages
      - run: npm run check:kvox-slice-peers
      - run: npm run check:kvox-pack

      - name: Publish (OIDC, provenance)
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          # A pre-release goes to the dist-tag recorded by `changeset pre enter`.
          tag_args=""
          if [ -f .changeset/pre.json ]; then
            tag=$(node -p "require('./.changeset/pre.json').tag")
            if [ -z "$tag" ] || [ "$tag" = "latest" ]; then
              echo "::error::.changeset/pre.json has tag '$tag'; refusing to publish a pre-release to latest"
              exit 1
            fi
            tag_args="--tag $tag"
          fi
          for p in $KVOX_PACKAGES; do
            name="@marinoscar/kvox-$p"
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION already published, skipping"
              continue
            fi
            # shellcheck disable=SC2086
            npm publish -w "$name" --access public $tag_args
          done

      - name: Tag the release
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "kvox-packages-v$VERSION"
          git push origin "kvox-packages-v$VERSION"

  publish-dry-run:
    name: Publish dry run
    needs: gate
    if: needs.gate.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run build:kvox-packages
      - run: npm run check:kvox-slice-peers
      - run: npm run check:kvox-pack

      - name: Pack the six tarballs
        run: |
          mkdir -p kvox-tarballs
          for p in $KVOX_PACKAGES; do
            npm pack -w "@marinoscar/kvox-$p" --pack-destination kvox-tarballs
          done
          ls -l kvox-tarballs

      - uses: actions/upload-artifact@v4
        with:
          name: kvox-tarballs
          path: kvox-tarballs/*.tgz
          if-no-files-found: error

      - name: Explain
        env:
          NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: |
          {
            echo "### Dry run: nothing was published"
            echo "Either \`NPM_PUBLISH_ENABLED\` is not \`true\` (it is \`${NPM_PUBLISH_ENABLED:-unset}\`) or the gate found the registry not ready."
            echo "The six tarballs are attached as the \`kvox-tarballs\` artifact. See docs/runbooks/release-kvox-packages.md."
          } >> "$GITHUB_STEP_SUMMARY"
