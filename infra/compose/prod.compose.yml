# =============================================================================
# Docker Compose - Production Overrides
# =============================================================================
# Usage:
#   docker compose -f base.compose.yml -f prod.compose.yml up
#
# Production settings: resource limits, restart policies, no exposed DB port.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # API - Production settings
  # ---------------------------------------------------------------------------
  api:
    build:
      target: production
    environment:
      - NODE_ENV=production
    # ⚠ REQUIRED BY THE DATABASE RESTORE, not only good hygiene. A restore's
    # swap ends in `process.exit(0)` on purpose — the connection pool is bound
    # to a database that has just been renamed out from under it and every
    # pooled session was terminated to allow the rename, so the process cannot
    # be trusted to keep serving. Without a supervisor that restarts it, a
    # SUCCESSFUL restore leaves the application down. See
    # docs/runbooks/database-restore.md §7.1.
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Web - Production settings
  # ---------------------------------------------------------------------------
  web:
    build:
      target: production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Nginx - Production settings
  # ---------------------------------------------------------------------------
  nginx:
    restart: unless-stopped
