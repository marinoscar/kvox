# =============================================================================
# The test database
# =============================================================================
#
# `pgvector/pgvector:pg16` rather than `postgres:16-alpine` (issue #178, epic
# #165). The `vector` extension ships as a control file that has to be present
# on the SERVER; `CREATE EXTENSION vector` cannot install it from the client
# side. Plain `postgres:16-alpine` carries no such file, so the semantic-search
# migration aborts there — and it aborts inside `prisma migrate deploy`, which
# means CI would go red ON THE MIGRATION rather than on a test, with a Prisma
# stack trace instead of a failing assertion.
#
# Same PostgreSQL major (16), so the on-disk format is unchanged and an
# existing `test-db-data` volume keeps working. The base OS moves Alpine →
# Debian, which is a property of the image and not of the data directory.
#
# TWO LOGINS. POSTGRES_USER is the image's bootstrap superuser (`postgres`,
# administration only: the scripts in postgres-init/ connect as it). The
# application role `kvox_app` is created on the first start of an empty volume
# by 10-application-role.sh (NOSUPERUSER NOBYPASSRLS, owner of the database),
# and the extensions script creates `vector` and `pg_trgm` as the superuser.
# Tests that must exercise row-level security connect as kvox_app; an existing
# `test-db-data` volume predates the role, so recreate it
# (`docker compose -f test.compose.yml down -v`) to get it.
# =============================================================================

services:
  db-test:
    image: pgvector/pgvector:pg16
    container_name: kvox-db-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kvox_test
      APP_DB_USER: kvox_app
      APP_DB_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - test-db-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  test-db-data:
