# =============================================================================
# Docker Compose - Development Overrides
# =============================================================================
# Usage:
#   docker compose -f base.compose.yml -f dev.compose.yml up
#
# Provides development-specific settings: hot reload, exposed ports, volumes.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Nginx - Development overrides
  # ---------------------------------------------------------------------------
  nginx:
    volumes:
      # Replaces the strict csp.conf from base.compose.yml (Compose merges
      # volumes keyed by container path). The Vite dev server injects an
      # inline React Refresh preamble script that `script-src 'self'` blocks,
      # which leaves the app a blank page; this policy permits it.
      # Development only.
      #
      # ⚠ THE CONTAINER PATH MUST MATCH base.compose.yml'S EXACTLY, or Compose
      # keeps BOTH mounts and the strict policy wins. Since #21 that path is
      # the envsubst template, not /etc/nginx/csp.conf — the rendering (and
      # therefore ${STORAGE_CSP_ORIGIN}) is inherited from base unchanged.
      - ../nginx/csp.dev.conf:/etc/nginx/templates/csp.conf.template:ro

  # ---------------------------------------------------------------------------
  # API - Development overrides
  # ---------------------------------------------------------------------------
  api:
    build:
      target: development
    volumes:
      - ../../apps/api/src:/app/apps/api/src:ro
      - ../../apps/api/prisma:/app/apps/api/prisma:ro
    environment:
      - NODE_ENV=development
    command: npm run start:dev

  # ---------------------------------------------------------------------------
  # Web - Development overrides
  # ---------------------------------------------------------------------------
  web:
    build:
      target: development
    volumes:
      - ../../apps/web/src:/app/apps/web/src:ro
    environment:
      - NODE_ENV=development
    command: npm run dev
