# =============================================================================
# Docker Compose - VPS Overrides
# =============================================================================
# Applied AFTER prod.compose.yml, for a deployment that sits behind a shared
# host reverse proxy (the /opt/infra/proxy model):
#
#   docker compose \
#     -f base.compose.yml \
#     -f prod.compose.yml \
#     -f vps.compose.yml \
#     up -d
#
# This file exists for one reason above all others: NOTHING IN THE STACK MAY
# BE PUBLISHED ON A PUBLIC INTERFACE. Everything reaches the application
# through the host proxy, which terminates TLS and holds the certificate.
#
# Two other things live here, both VPS-specific by definition:
#
#   - The read-only `deploy-info` mount on the api service (issue #120):
#     metadata the CLI writes about THIS deployment on THIS server. Local dev
#     has no deploy and nothing to mount.
#   - The container memory limits as `${API_MEM_LIMIT:-512M}` and
#     `${WEB_MEM_LIMIT:-128M}` interpolations (issue #127). The install wizard
#     suggests them from the server's RAM and writes them to .env; the
#     defaults equal prod.compose.yml's fixed limits, so a .env without them
#     changes nothing. They are set at the SAME KEY prod.compose.yml uses
#     (`deploy.resources.limits.memory`), not the legacy `mem_limit`: compose
#     refuses a service that sets distinct values on both, and an overlay
#     only replaces the scalar it names.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Nginx - loopback only
  # ---------------------------------------------------------------------------
  nginx:
    # `!override` REPLACES the inherited ports list instead of merging with it.
    #
    # This is the whole point of the file and the one line in it that fails
    # silently when written wrong. Compose MERGES sequences across overlay
    # files, so a plain `ports:` here would ADD this mapping and keep
    # base.compose.yml's "3535:80" — leaving the application published on
    # 0.0.0.0 exactly as before, while the file looks like it fixed it.
    #
    # Verify with `docker compose ... config`: there must be ONE entry, and it
    # must carry host_ip 127.0.0.1.
    ports: !override
      - "127.0.0.1:${APP_BIND_PORT:-3535}:80"
    # An unbounded json-file log is a slow-motion outage on a small VPS: the
    # disk fills, and everything that writes fails at once, usually first
    # showing up as Postgres or Docker itself refusing to work.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # API - log rotation, deploy-info mount
  # ---------------------------------------------------------------------------
  api:
    # What was deployed here, for `GET /api/admin/about` (issue #120). The CLI
    # writes `<root>/deploy-info/info.json` on every install and update; the
    # API reads it at DEPLOY_INFO_PATH.
    #
    # A DIRECTORY is mounted, not the file: the CLI rewrites info.json with a
    # temp-file-and-rename, which replaces the inode, and a single-file bind
    # mount would keep the container on the old inode forever. Read-only
    # because the container has no business writing it.
    #
    # Relative paths resolve against this file's directory, `repo/infra/
    # compose`, so `../../..` is exactly the app root. DEPLOY_ROOT is written
    # into .env by the CLI (beside COMPOSE_PROJECT_NAME) so an explicit --root
    # still mounts the right directory. No `!override`: base.compose.yml gives
    # `api` no `volumes`, and its `environment` is a list this merges with.
    volumes:
      - ${DEPLOY_ROOT:-../../..}/deploy-info:/app/deploy-info:ro
    environment:
      - DEPLOY_INFO_PATH=/app/deploy-info/info.json
    # Suggested by the wizard from this server's RAM (issue #127); the default
    # is prod.compose.yml's own limit, so an older .env is unchanged.
    deploy:
      resources:
        limits:
          memory: ${API_MEM_LIMIT:-512M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Web - log rotation, memory limit
  # ---------------------------------------------------------------------------
  web:
    deploy:
      resources:
        limits:
          memory: ${WEB_MEM_LIMIT:-128M}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
