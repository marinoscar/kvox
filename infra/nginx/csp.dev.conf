# GENERATED from @marinoscar/platform-infra@0.1.0-next.5 (nginx) — do not edit; extend through infra/nginx/app.d/ (an include point) or a compose overlay
# Source of truth: @marinoscar/platform-infra/nginx/csp.dev.conf; re-materialise with `npx platform-infra sync`
# =============================================================================
# Content Security Policy - development overlay
# =============================================================================
# Mounted over /etc/nginx/csp.conf by dev.compose.yml. NEVER used in
# production: prod.compose.yml leaves the strict csp.conf from base in place.
#
# Structure mirrors csp.conf — a map selecting a policy per request URI, read
# by the single `add_header Content-Security-Policy $csp_policy always;` in
# nginx.conf. Only the default (application) entry differs from csp.conf; the
# /api/docs entry is identical, because the Scalar reference has the same
# requirements in both environments.
# =============================================================================

# =============================================================================
# App extension of the policy (include point: app.d/csp/)
# =============================================================================
# The app adds sources to the DEFAULT policy below without copying it. Each
# map is empty unless the app drops a file into infra/nginx/app.d/csp/ (an
# empty directory is valid):
#
#   app.d/csp/connect-src*.conf   sources appended to connect-src
#   app.d/csp/img-src*.conf       ... img-src
#   app.d/csp/media-src*.conf     ... media-src
#   app.d/csp/font-src*.conf      ... font-src
#   app.d/csp/style-src*.conf     ... style-src (a stylesheet host)
#   app.d/csp/extra*.conf         whole directives the policy does not carry
#                                 yet (frame-src, child-src, ...)
#
# A file is the BODY of a map keyed on the request path, so it is a `default`
# line (one per directive) and optionally path patterns:
#
#   default " wss://realtime.example.com https://api.example.com";   # leading space
#   default "; frame-src https://www.youtube.com";                   # extra: leading ;
#
# WHAT THIS CAN AND CANNOT DO, ON PURPOSE.
#   - Additive only: it appends to a directive or adds a directive. It cannot
#     remove or replace anything the platform sets. A CSP ignores a repeated
#     directive name after the first, so `extra` cannot widen a directive the
#     policy already has (that is what the per-directive hooks are for).
#   - There is NO script-src hook and none for default-src, object-src,
#     base-uri, form-action or frame-ancestors: widening code execution or
#     framing is the one change that must be a visible edit of this file's
#     owner, not an include. (connect-src already allows https:; the hook
#     matters for ws:/wss: and for non-https hosts.)
#   - Only the default policy is extended. The /api/docs policy is the Scalar
#     reference page and stays exactly as written.
#   - Every addition sits in the app's own repository (infra/nginx/app.d/csp/),
#     so review sees it. Values are written into a response header: a quote
#     or a newline in one is a config error, caught by `nginx -t`.
# =============================================================================

map $uri $csp_connect_src_extra { include /etc/nginx/app.d/csp/connect-src*.conf; }
map $uri $csp_img_src_extra     { include /etc/nginx/app.d/csp/img-src*.conf; }
map $uri $csp_media_src_extra   { include /etc/nginx/app.d/csp/media-src*.conf; }
map $uri $csp_font_src_extra    { include /etc/nginx/app.d/csp/font-src*.conf; }
map $uri $csp_style_src_extra   { include /etc/nginx/app.d/csp/style-src*.conf; }
map $uri $csp_extra             { include /etc/nginx/app.d/csp/extra*.conf; }

map $uri $csp_policy {
    # ---------------------------------------------------------------------
    # Default: the application, served by the Vite dev server.
    #
    # Why this differs from csp.conf:
    #
    #   Vite injects an INLINE <script type="module"> into index.html that
    #   installs the React Refresh preamble (injectIntoGlobalHook). Under the
    #   strict `script-src 'self'` the browser blocks it,
    #   @vitejs/plugin-react then throws "can't detect preamble. Something is
    #   wrong." and the app renders a permanently blank page. 'unsafe-inline'
    #   is what lets the preamble run.
    #
    #   'unsafe-eval' covers the dev-only evaluation Vite/React Refresh
    #   perform while transforming modules on the fly.
    #
    # A production build contains no inline preamble and needs neither
    # keyword, which is why this relaxation is confined to this overlay.
    #
    # worker-src and manifest-src are explicit for PWA support (issue #220);
    # media-src matches csp.conf so signed bucket URLs can play (issue #510);
    # connect-src matches csp.conf so Voice mode's SDP exchange reaches the
    # provider (issue #559).
    # See csp.conf for the full rationale of each.
    # ---------------------------------------------------------------------
    default      "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'$csp_style_src_extra; img-src 'self' data: blob: https:$csp_img_src_extra; media-src 'self' blob: https:$csp_media_src_extra; font-src 'self' data:$csp_font_src_extra; connect-src 'self' https:$csp_connect_src_extra; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'$csp_extra";

    # ---------------------------------------------------------------------
    # The Scalar API reference at /api/docs. Kept identical to csp.conf — the
    # docs page is served by the API in both environments and always needs the
    # CDN bundle plus its inline bootstrap. See csp.conf for the full
    # rationale.
    # ---------------------------------------------------------------------
    ~^/api/docs  "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.scalar.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}
