# =============================================================================
# The object store's origin for the Content Security Policy
# =============================================================================
# THE ONLY `envsubst` TEMPLATE OF THE NGINX CONFIGURATION. base.compose.yml
# mounts it at /etc/nginx/templates/storage-origin.conf.template; the nginx
# image's entrypoint renders it to /etc/nginx/storage-origin.conf before nginx
# starts (NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx), and csp.conf and csp.dev.conf
# include the result. NGINX_ENVSUBST_FILTER limits the substitution to
# STORAGE_CSP_ORIGIN, so nothing else in this file is touched.
#
# Why this is a file of its own and not part of csp.conf: the deploy CLI
# compares csp.conf byte for byte with the copy inside the running container, so
# csp.conf must be mounted unrendered. See csp.conf.
#
# Empty (the default) leaves `$csp_storage_origin` empty, and the policy reads
# connect-src/media-src 'self' only. Never a wildcard.
# =============================================================================
map $uri $csp_storage_origin {
    default "${STORAGE_CSP_ORIGIN}";
}
