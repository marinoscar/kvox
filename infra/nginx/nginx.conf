# GENERATED from @marinoscar/platform-infra@0.1.0-next.8 (nginx) — do not edit; extend through infra/nginx/app.d/ (an include point) or a compose overlay
# Source of truth: @marinoscar/platform-infra/nginx/nginx.conf; re-materialise with `npx platform-infra sync`
# =============================================================================
# Nginx Configuration - Reverse Proxy
# =============================================================================
# Routes:
#   /           -> web (React frontend)
#   /api        -> api (NestJS backend)
#   /api/docs   -> api (Swagger UI)
#
# Plus an internal-only listener on :8081 serving /nginx_status (stub_status)
# to the telemetry collector; see the second server block at the end.
#
# GENERATED into the app by `platform-infra sync`; never edited there. An app
# extends it through four include points, all under /etc/nginx/app.d/
# (infra/nginx/app.d/ in the app, mounted by base.compose.yml):
#
#   app.d/http/*.conf              http level: maps, upstreams, zones
#   app.d/server/*.conf            server level of the public listener
#   app.d/locations/*.conf         locations, included BEFORE `location /api`
#   app.d/permissions-policy.conf  the Permissions-Policy header (one file,
#                                  created from the platform default)
#
# An app's SSE route is one location that includes platform/sse-proxy.conf,
# which carries the security headers too (see the note on add_header below).
# =============================================================================

# -----------------------------------------------------------------------------
# Connection and file-descriptor limits, sized for long-lived SSE  (issue #684)
# -----------------------------------------------------------------------------
# Every server-sent-event stream holds TWO connections in nginx for its whole
# lifetime: the client side and the upstream side to the API. The streams are
# /api/notifications/stream (one per open tab, up to 1h), and the AI and
# telemetry assistant streams (up to 600s each).
#
#   concurrent SSE streams  ~=  worker_processes x worker_connections / 2
#                               minus ordinary traffic and upstream keepalives
#
# The stock 1024 saturated ONE worker at about 500 open tabs, after which
# nginx logs "worker_connections are not enough" and new requests fail. With
# `auto` on a 2-vCPU VPS: 2 x 16384 / 2 ~= 16k streams -- far more than one
# API process should hold, so the API, not nginx, is the next limit.
#
# Sizing rule: worker_rlimit_nofile >= worker_connections (one descriptor per
# connection, plus upstream sockets and log files), and the container's hard
# `nofile` ulimit >= worker_rlimit_nofile, or the raise is refused and nginx
# hits "Too many open files" instead. base.compose.yml sets that ulimit on the
# nginx and api services. apps/api/test/nginx-connection-limits.spec.ts pins
# all three together.
# -----------------------------------------------------------------------------
worker_processes auto;
worker_rlimit_nofile 65536;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript;

    # Upstream definitions
    upstream api_upstream {
        server api:3000;
        keepalive 32;
    }

    upstream web_upstream {
        server web:5173;
        keepalive 32;
    }

    # Content Security Policy, split out into csp.conf (maps are only valid at
    # http scope). Split rather than inlined here because /api/docs (the
    # Scalar reference) needs a different policy than the rest of the app, and
    # the dev compose overlay needs to relax script-src for Vite's inline
    # React Refresh preamble — both are one-file swaps this way instead of
    # forking the whole of nginx.conf. See csp.conf and csp.dev.conf for the
    # per-policy rationale.
    include /etc/nginx/csp.conf;

    # App include point (http level): maps, upstreams, rate-limit zones of the
    # app, from infra/nginx/app.d/http/. An empty directory is valid.
    include /etc/nginx/app.d/http/*.conf;

    server {
        listen 80;
        server_name localhost;

        # ---------------------------------------------------------------------
        # Security headers
        # ---------------------------------------------------------------------
        # NOTE: nginx's add_header REPLACES, it does not merge. Any location
        # block that declares its own add_header loses every header set here,
        # so a location needing an extra header must repeat these too: it
        # includes the same file (platform/sse-proxy.conf already does).
        #
        # The set lives in platform/security-headers.conf: X-Frame-Options,
        # X-Content-Type-Options, X-XSS-Protection, Referrer-Policy, the app's
        # Permissions-Policy (app.d/permissions-policy.conf), HSTS (inert over
        # plain HTTP, so on http://localhost:3535) and the per-path
        # Content-Security-Policy selected by the $csp_policy map in csp.conf
        # (dev.compose.yml overrides it with csp.dev.conf).
        include /etc/nginx/platform/security-headers.conf;

        # App include point (server level): directives of the app for the
        # public listener, from infra/nginx/app.d/server/.
        include /etc/nginx/app.d/server/*.conf;

        # -------------------------------------------------------------------------
        # Server-Sent Events stream -> NestJS backend (issue #127, epic #109)
        # -------------------------------------------------------------------------
        #
        # A DEDICATED BLOCK, because the buffering and timeout defaults that suit
        # a JSON request are not the ones you want on a connection that stays
        # open for hours. nginx matches the LONGEST prefix, so this wins over
        # `/api` below regardless of the order they appear in.
        #
        # Honest scope of what was verified, so nobody trusts this more than it
        # earned: this config was run against real nginx with a real SSE
        # upstream, and events arrive at the client one second apart, unbuffered.
        # That is the property that matters and it holds.
        #
        # What was NOT reproduced, and is therefore NOT claimed here: with these
        # directives removed, a small-payload stream still passed through
        # promptly in that same test, and an idle stream was not cut off at
        # `proxy_read_timeout`. So treat the directives below as the documented,
        # widely-recommended configuration for SSE behind nginx — defensive
        # against buffering under load, larger payloads, gzip, and other nginx
        # builds — rather than as fixes for failures demonstrated here.
        #
        #   proxy_buffering off / proxy_cache off
        #     The standard SSE recommendation. The API also sets
        #     `X-Accel-Buffering: no` on the response, which is the server-side
        #     half of the same intent; neither is relied on alone.
        #
        #   proxy_read_timeout 1h
        #     Notifications are rare by nature, so an idle connection is the
        #     normal case, not a stuck one. The API heartbeats every 25s, so a
        #     read timeout should only ever fire if the API has genuinely
        #     stopped writing.
        #
        #   proxy_set_header Connection ''
        #     The `/api` block sets `Connection "upgrade"` unconditionally for
        #     WebSocket support. SSE is ordinary HTTP, not an upgrade, so the
        #     inherited header is simply wrong here.
        #
        # VERIFY THROUGH THE PROXY, never against the API directly — a buffering
        # problem is invisible when you curl port 3000.
        location /api/notifications/stream {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';

            # Stream, do not accumulate
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # Long-lived by design; the API heartbeats every 25s
            proxy_connect_timeout 60s;
            proxy_send_timeout 1h;
            proxy_read_timeout 1h;
        }

        # -------------------------------------------------------------------------
        # AI response streaming (SSE) — issue #433, epic #419
        # -------------------------------------------------------------------------
        # `POST /api/ai/responses/stream` answers one prompt as a
        # `text/event-stream` of token deltas. Through the generic `/api` block
        # below it would be BUFFERED (the user sees nothing until nginx's buffer
        # fills or the answer ends) and cut off by its 60s read timeout — a
        # reasoning model can legitimately think for longer than that before its
        # first token. Same treatment as the notifications stream above, and the
        # same longest-prefix rule makes it win over `/api` regardless of order.
        #
        #   proxy_buffering off / proxy_cache off
        #     Forward each frame as it is written. The API also sends
        #     `X-Accel-Buffering: no` (the server-side half of the same intent).
        #
        #   proxy_read_timeout 600s
        #     One answer, not a feed: ten minutes bounds a runaway generation.
        #     The API writes a `: ping` comment every 15s, so the timeout only
        #     fires if the API has genuinely stopped writing.
        #
        #   proxy_set_header Connection ''
        #     SSE is ordinary HTTP, not a WebSocket upgrade (see above).
        #
        #   client_max_body_size 2m
        #     The API caps the JSON body at 1 MB; this lets that limit answer
        #     with its own error instead of a bare nginx 413.
        #
        # gzip: `text/event-stream` is deliberately absent from `gzip_types`
        # above — compressing a stream buffers it. Keep it absent.
        #
        # Closing the connection (a Stop button, a closed tab) propagates to
        # the API, which aborts the provider call.
        location /api/ai/responses/stream {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';

            # Stream, do not accumulate
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # One long answer; the API heartbeats every 15s
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            client_max_body_size 2m;
        }

        # -------------------------------------------------------------------------
        # Telemetry AI assistant streaming (SSE) — issue #536, epic #528
        # -------------------------------------------------------------------------
        # `POST /api/admin/telemetry/assistant/stream` answers one question as a
        # `text/event-stream` of tool steps and a final answer. Identical needs
        # to the AI response stream above (unbuffered, long read timeout, the
        # API heartbeats every 15s, never gzipped); its own block because the
        # longest-prefix match for it would otherwise be the generic `/api`.
        location /api/admin/telemetry/assistant/stream {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection '';

            # Stream, do not accumulate
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # One turn of up to 20 model round-trips and queries; the API heartbeats every 15s
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            client_max_body_size 2m;
        }

        # -------------------------------------------------------------------------
        # App include point (locations): the app's own locations, from
        # infra/nginx/app.d/locations/, BEFORE `location /api` so a reader sees
        # them next to the platform's streams. A prefix location wins by
        # length wherever it sits (so `/api/things/stream` beats `/api`); regex
        # locations are tried in file order, so an app's regex here is tried
        # before any regex the platform may add further down. An SSE route is:
        #
        #   location /api/things/stream { include /etc/nginx/platform/sse-proxy.conf; }
        # -------------------------------------------------------------------------
        include /etc/nginx/app.d/locations/*.conf;

        # -------------------------------------------------------------------------
        # API routes -> NestJS backend
        # -------------------------------------------------------------------------
        location /api {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # WebSocket support (if needed)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # -------------------------------------------------------------------------
        # Frontend routes -> React app
        # -------------------------------------------------------------------------
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for HMR in development
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # -------------------------------------------------------------------------
        # Health check endpoint for nginx itself
        # -------------------------------------------------------------------------
        location /nginx-health {
            access_log off;
            # default_type rather than add_header: add_header here would
            # replace the server-level security headers for this location.
            default_type text/plain;
            return 200 "healthy\n";
        }

        # -------------------------------------------------------------------------
        # The status page is NOT served here (issue #599)
        # -------------------------------------------------------------------------
        # stub_status lives on the internal listener below. Without this block
        # the path would fall through to `location /` and the SPA would answer
        # it with index.html and a 200, which reads like the page exists. An
        # explicit 404 on the public port says it does not.
        location = /nginx_status {
            access_log off;
            return 404;
        }
    }

    # =========================================================================
    # Internal status listener (issue #599): nginx edge metrics
    # =========================================================================
    # stub_status (active/reading/writing/waiting connections, accepted and
    # handled connections, total requests) for the telemetry collector's
    # `nginx` receiver, which scrapes http://nginx:8081/nginx_status over the
    # compose network.
    #
    # INTERNAL ONLY, by two independent means:
    #
    #   1. Port 8081 is published by NO compose file. base.compose.yml maps
    #      only container port 80 (dev: 3535; VPS: 127.0.0.1:<APP_BIND_PORT>,
    #      which is what the shared host proxy forwards to), so neither the
    #      internet nor the host proxy has a route to this port. Never add
    #      8081 to a `ports:` list.
    #   2. allow/deny below admit only loopback and the private ranges compose
    #      networks are allocated from; anything else gets 403 even if a
    #      mapping were ever added by mistake.
    #
    # The counters are not secret, but they are operational detail nobody
    # outside the stack needs. No security headers here: nothing but the
    # collector reads this listener, and it never renders a page.
    server {
        listen 8081;
        server_name _;
        access_log off;

        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        location = /nginx_status {
            stub_status;
        }

        location / {
            return 404;
        }
    }
}
