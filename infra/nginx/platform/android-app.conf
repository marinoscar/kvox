# Source of truth: @marinoscar/platform-infra/nginx/platform/android-app.conf; re-materialise with `npx platform-infra sync`
# =============================================================================
# The Android companion's edge locations (#746, PP-9.4; from EvoPath)
# =============================================================================
# Include it from an app location file, app.d/locations/android-app.conf:
#
#   include /etc/nginx/platform/android-app.conf;
#
# Three locations, all to the API (`@marinoscar/platform-api/android-app`):
#
#   = /.well-known/assetlinks.json
#     Chrome and Google's Digital Asset Links verifier fetch this,
#     unauthenticated, to decide whether a Trusted Web Activity may hide its
#     URL bar. The trusted list is runtime configuration, so the API serves
#     it at /api/well-known/assetlinks.json; without this block the path
#     falls through to `location /` and the SPA answers with index.html,
#     which fails verification. `proxy_pass` with a URI replaces the matched
#     path. Exact match, so it wins over every prefix block.
#
#   = /api/admin/android-app/releases
#     The APK upload: multipart, up to 150 MiB (the API refuses more with its
#     own 413). The generic `/api` block keeps nginx's 1 MB body default and a
#     60s timeout, so this raises the body limit just above the API's,
#     streams the body instead of spooling it to disk
#     (`proxy_request_buffering off`; the API streams it to object storage)
#     and allows a slow uplink ten minutes. GET (the release list) on the
#     same path is unaffected.
#
#   /api/android-app/download/
#     The signed APK download: unbuffered, with a timeout a slow mobile
#     connection can live with.
#
# No add_header in any of them: one would replace the server-level security
# headers (nginx replaces, never merges); the API sets Content-Type and
# Cache-Control itself.
# =============================================================================

location = /.well-known/assetlinks.json {
    proxy_pass http://api_upstream/api/well-known/assetlinks.json;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection '';

    proxy_connect_timeout 10s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}

location = /api/admin/android-app/releases {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection '';

    client_max_body_size 160m;
    proxy_request_buffering off;

    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
}

location /api/android-app/download/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection '';

    proxy_buffering off;
    proxy_cache off;

    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
}
