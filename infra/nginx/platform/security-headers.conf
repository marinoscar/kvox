# Source of truth: @marinoscar/platform-infra/nginx/platform/security-headers.conf; re-materialise with `npx platform-infra sync`
# =============================================================================
# Security headers of the public listener
# =============================================================================
# Included at server level by nginx.conf, and again by every location that
# declares an add_header of its own (platform/sse-proxy.conf does).
#
# WHY A FILE: nginx's add_header REPLACES, it does not merge. A location with
# even one add_header of its own inherits NONE of the server-level ones, so
# without this file every such location would be a hand-copied list of headers
# that drifts. Including the one file keeps the set identical everywhere.
#
# The Permissions-Policy header is the app's: app.d/permissions-policy.conf,
# created from the platform default by `platform-infra sync` and owned by the
# app from then on.
# =============================================================================

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
include /etc/nginx/app.d/permissions-policy.conf;

# HSTS. Browsers ignore this over plain HTTP, so it is inert for local
# development on http://localhost:3535 and takes effect only once the app is
# served over TLS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content Security Policy. Per-path policy selected by the $csp_policy map in
# csp.conf (dev.compose.yml overrides it with csp.dev.conf). worker-src and
# manifest-src are explicit for PWA support (issue #220): default-src 'self'
# covers both in spec-compliant browsers, but Safari has historically required
# manifest-src spelled out. See csp.conf / csp.dev.conf for the full
# per-policy rationale.
add_header Content-Security-Policy $csp_policy always;
