# =============================================================================
# Server-sent events to the API: the body of an SSE location
# =============================================================================
# Include it as the whole body of an app location, from app.d/locations/:
#
#   location /api/things/stream { include /etc/nginx/platform/sse-proxy.conf; }
#
# The same treatment as the platform's own AI and telemetry-assistant streams
# in nginx.conf (see the notes there):
#
#   proxy_buffering off / proxy_cache off
#     Forward each frame as it is written. The API also sends
#     `X-Accel-Buffering: no`, the server-side half of the same intent.
#   proxy_read_timeout 600s
#     One long answer, not an open feed. The API must write a heartbeat (a
#     `: ping` comment) more often than this, or the stream is cut off.
#   proxy_set_header Connection ''
#     SSE is ordinary HTTP, not a WebSocket upgrade.
#   client_max_body_size 2m
#     A POST that starts a stream carries a JSON body; the API's own cap
#     answers with its own error instead of a bare nginx 413.
#
# AND THE SECURITY HEADERS. A location that adds even one header of its own
# loses every server-level add_header (nginx replaces, never merges), so this
# snippet includes platform/security-headers.conf itself. An app location can
# then add an add_header of its own without silently dropping the CSP, HSTS
# or X-Frame-Options.
#
# A directive set here cannot be set again in the same location (nginx refuses
# a duplicate). A route that needs other timeouts writes its own location and
# includes platform/security-headers.conf instead.
# =============================================================================

proxy_pass http://api_upstream;
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
proxy_set_header Connection '';

# Stream, do not accumulate
proxy_buffering off;
proxy_cache off;
chunked_transfer_encoding off;

# One long answer; the API heartbeats more often than the read timeout
proxy_connect_timeout 60s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;

client_max_body_size 2m;

include /etc/nginx/platform/security-headers.conf;
