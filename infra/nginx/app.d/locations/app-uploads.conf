# =============================================================================
# This app's multipart upload routes (APP-OWNED)
# =============================================================================
# nginx refuses a request body above `client_max_body_size` (1 MiB when unset,
# and nothing in the platform's nginx.conf sets it for `/api`) with a 413 that
# never reaches the API. Three routes take a multipart file larger than that, and
# the API enforces the real ceiling itself while it reads the stream:
#
#   POST /api/graph/imports            an RDF file, 20 MiB (GRAPH_IMPORT_MAX_BYTES)
#   POST /api/transcripts/imports      a transcript JSON export, 25 MiB (the
#                                      transcripts slice's `maxImportBytes`, #571)
#   POST /api/notes/sources/documents  a note source, `ai.maxDocumentBytes`
#                                      (25 MB by default, at most 256 MiB)
#
# The sizes here are a little above those ceilings so the API answers with its
# own error, not a bare nginx 413. `proxy_request_buffering off` hands the body
# to the API as it arrives instead of spooling a copy to disk first. Everything
# else repeats the generic `/api` location; no `add_header` here, so the
# server-level security headers are inherited.
#
# The edge proxy of a VPS deployment allows 100 MiB by default (`MAX_FILE_SIZE`
# widens it); raise that too when `ai.maxDocumentBytes` goes above it.
# =============================================================================

location = /api/graph/imports {
    client_max_body_size 21m;
    proxy_request_buffering off;

    proxy_pass http://api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection '';

    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}

location = /api/transcripts/imports {
    client_max_body_size 26m;
    proxy_request_buffering off;

    proxy_pass http://api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection '';

    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}

location = /api/notes/sources/documents {
    client_max_body_size 257m;
    proxy_request_buffering off;

    proxy_pass http://api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection '';

    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}
