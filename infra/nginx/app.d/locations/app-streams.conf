# =============================================================================
# This app's server-sent-event routes (APP-OWNED)
# =============================================================================
# Three GET routes keep one response open for minutes and write a `: heartbeat`
# comment about every 25 seconds:
#
#   GET /api/notes/:id/stream               a note's live updates
#   GET /api/note-generations/:id/stream    one generation run
#   GET /api/ask/messages/:id/stream        one assistant answer
#
# Through the generic `/api` location they would work only because the API sends
# `X-Accel-Buffering: no` and the heartbeat is shorter than that location's 60 s
# read timeout. Both are properties of the application code, not of this file.
# These locations make the proxy side explicit: unbuffered, a 600 s read timeout
# and the security headers (platform/sse-proxy.conf carries all three).
#
# A regex location is tried after the longest prefix match and wins over the
# plain `location /api`, so the order of this file against the platform's own
# stream locations does not matter. The edge proxy of a VPS deployment has the
# same two paths in the CLI's `proxy.streamPaths` (apps/cli/src/app.ts).
# =============================================================================

location ~ ^/api/(notes|note-generations)/[^/]+/stream$ {
    include /etc/nginx/platform/sse-proxy.conf;
}

location ~ ^/api/ask/messages/[^/]+/stream$ {
    include /etc/nginx/platform/sse-proxy.conf;
}
