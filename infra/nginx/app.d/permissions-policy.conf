# =============================================================================
# Permissions-Policy of this app (APP-OWNED)
# =============================================================================
# Created once by `platform-infra sync` from the platform default and never
# overwritten: edit it freely. It is included by platform/security-headers.conf,
# so it applies at server level and in every location that repeats the
# security headers. Keep it to exactly one add_header Permissions-Policy line.
#
# microphone=(), as this app has always sent it: the web app never opens the
# microphone (it uploads recordings made elsewhere), so the device stays off for
# every origin, our own included. The platform default is microphone=(self),
# which exists for an app with a voice feature; if this app gains one, change
# it here (an empty allowlist cannot be overridden by any browser setting, so
# getUserMedia would reject).
#
# An app that asks for the device location sets geolocation=(self) here.
# =============================================================================

add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
