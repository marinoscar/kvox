# GENERATED from @marinoscar/platform-infra@0.1.0-next.8 (nginx) — do not edit; extend through infra/nginx/app.d/ (an include point) or a compose overlay
# Source of truth: @marinoscar/platform-infra/nginx/csp.conf; re-materialise with `npx platform-infra sync`
# =============================================================================
# Content Security Policy - default (production-grade)
# =============================================================================
# Included from the http context in nginx.conf, which selects a policy per
# request with `add_header Content-Security-Policy $csp_policy always;`.
# base.compose.yml mounts this file at /etc/nginx/csp.conf; dev.compose.yml
# mounts csp.dev.conf over the same path, so the development stack can relax
# the app policy without duplicating the whole of nginx.conf.
#
# A map rather than a single header because /api/docs needs a different policy
# from the rest of the app (see below), and nginx's add_header REPLACES rather
# than merges — a per-location header would silently drop every other security
# header set on the server block.
# =============================================================================

# =============================================================================
# App extension of the policy (include point: app.d/csp/)
# =============================================================================
# The app adds sources to the DEFAULT policy below without copying it. Each
# map is empty unless the app drops a file into infra/nginx/app.d/csp/ (an
# empty directory is valid):
#
#   app.d/csp/connect-src*.conf   sources appended to connect-src
#   app.d/csp/img-src*.conf       ... img-src
#   app.d/csp/media-src*.conf     ... media-src
#   app.d/csp/font-src*.conf      ... font-src
#   app.d/csp/style-src*.conf     ... style-src (a stylesheet host)
#   app.d/csp/extra*.conf         whole directives the policy does not carry
#                                 yet (frame-src, child-src, ...)
#
# A file is the BODY of a map keyed on the request path, so it is a `default`
# line (one per directive) and optionally path patterns:
#
#   default " wss://realtime.example.com https://api.example.com";   # leading space
#   default "; frame-src https://www.youtube.com";                   # extra: leading ;
#
# WHAT THIS CAN AND CANNOT DO, ON PURPOSE.
#   - Additive only: it appends to a directive or adds a directive. It cannot
#     remove or replace anything the platform sets. A CSP ignores a repeated
#     directive name after the first, so `extra` cannot widen a directive the
#     policy already has (that is what the per-directive hooks are for).
#   - There is NO script-src hook and none for default-src, object-src,
#     base-uri, form-action or frame-ancestors: widening code execution or
#     framing is the one change that must be a visible edit of this file's
#     owner, not an include. (connect-src already allows https:; the hook
#     matters for ws:/wss: and for non-https hosts.)
#   - Only the default policy is extended. The /api/docs policy is the Scalar
#     reference page and stays exactly as written.
#   - Every addition sits in the app's own repository (infra/nginx/app.d/csp/),
#     so review sees it. Values are written into a response header: a quote
#     or a newline in one is a config error, caught by `nginx -t`.
# =============================================================================

map $uri $csp_connect_src_extra { include /etc/nginx/app.d/csp/connect-src*.conf; }
map $uri $csp_img_src_extra     { include /etc/nginx/app.d/csp/img-src*.conf; }
map $uri $csp_media_src_extra   { include /etc/nginx/app.d/csp/media-src*.conf; }
map $uri $csp_font_src_extra    { include /etc/nginx/app.d/csp/font-src*.conf; }
map $uri $csp_style_src_extra   { include /etc/nginx/app.d/csp/style-src*.conf; }
map $uri $csp_extra             { include /etc/nginx/app.d/csp/extra*.conf; }

map $uri $csp_policy {
    # ---------------------------------------------------------------------
    # Default: the application itself.
    #
    #   script-src is 'self' only. A production build emits no inline
    #     scripts, so nothing legitimate needs 'unsafe-inline' here.
    #   style-src allows 'unsafe-inline' because MUI/emotion injects styles
    #     at runtime; removing it requires migrating to nonce-based styles.
    #   img-src allows https: because avatars come from Google
    #     (lh3.googleusercontent.com) and uploaded images are served from a
    #     configurable S3 endpoint, which may be AWS or MinIO.
    #   media-src allows https: for the same reason as img-src: generated
    #     speech (and any other <audio>/<video>) plays from a short-lived
    #     signed URL on that same runtime-configured bucket host. Without it,
    #     media falls back to default-src 'self' and the player is refused
    #     while the download link (a navigation, not a media load) still
    #     works (issue #510). blob: covers locally recorded clips.
    #   connect-src allows https: for one caller: the AI Playground's Voice
    #     mode POSTs its WebRTC SDP offer straight to the provider's connect
    #     URL (e.g. https://api.openai.com/v1/realtime/calls) with the
    #     server-minted ephemeral secret. That host is runtime-configured
    #     (OpenAI, Azure, a gateway), so it cannot be listed here, the same
    #     reason img-src and media-src allow https:. Under 'self' alone the
    #     browser refuses the fetch and Start fails with "Could not connect
    #     to the provider" (issue #559). Everything else still talks to /api
    #     same-origin; script-src 'self' is what keeps injected script out.
    #   worker-src and manifest-src are explicit for PWA support (issue #220).
    #     default-src 'self' covers both in spec-compliant browsers, but Safari
    #     has historically required manifest-src spelled out. Being explicit
    #     protects against future default-src changes silently breaking the PWA.
    # ---------------------------------------------------------------------
    default      "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'$csp_style_src_extra; img-src 'self' data: blob: https:$csp_img_src_extra; media-src 'self' blob: https:$csp_media_src_extra; font-src 'self' data:$csp_font_src_extra; connect-src 'self' https:$csp_connect_src_extra; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'$csp_extra";

    # ---------------------------------------------------------------------
    # The Scalar API reference at /api/docs.
    #
    # apps/api/src/openapi/docs-page.ts loads the Scalar standalone bundle
    # from a CDN by design (DEFAULT_SCALAR_CDN, overridable via API_DOCS_CDN
    # for an air-gapped deployment) and bootstraps it from an inline
    # <script> block (buildDocsAuthScript) that exchanges the session cookie
    # for an access token before mounting. The default policy above blocks
    # all three, leaving the page a bare header bar.
    #
    #   script-src adds the CDN host and 'unsafe-inline'. The inline block
    #     interpolates a JSON config (the Scalar config object plus the
    #     resolved token), so its hash is not stable and a hash-based
    #     allowance would break whenever that config changes.
    #   style-src adds the CDN because the bundle ships its stylesheet there.
    #   font-src adds fonts.scalar.com — Scalar serves its Inter/mono webfonts
    #     from its own host, not from the CDN the bundle came from. Without it
    #     the reference still renders but falls back to system fonts.
    #   connect-src keeps 'self': the spec is fetched from /api/openapi.json
    #     and the session token from /api/auth/refresh, both same-origin. The
    #     CDN is not a fetch target.
    #
    # Deliberately scoped to this one path. An air-gapped deployment that sets
    # API_DOCS_CDN to a self-hosted bundle can drop the CDN host from here.
    # ---------------------------------------------------------------------
    ~^/api/docs  "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.scalar.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}
