# =============================================================================
# Content Security Policy - default (production-grade)
# =============================================================================
# Included from the http context in nginx.conf, which selects a policy per
# request with `add_header Content-Security-Policy $csp_policy always;`.
# base.compose.yml mounts this file at /etc/nginx/csp.conf; dev.compose.yml
# mounts csp.dev.conf over the same path, so the development stack can relax
# the app policy without duplicating the whole of nginx.conf.
#
# A map rather than a single header because /api/docs needs a different policy
# from the rest of the app (see below), and nginx's add_header REPLACES rather
# than merges — a per-location header would silently drop every other security
# header set on the server block.
# =============================================================================


# =============================================================================
# ⚠ THIS FILE IS AN `envsubst` TEMPLATE (issue #21)
# =============================================================================
# base.compose.yml mounts it at /etc/nginx/templates/csp.conf.template, and the
# official nginx image's own entrypoint (20-envsubst-on-templates.sh) renders it
# to /etc/nginx/csp.conf — the path nginx.conf already includes — before nginx
# starts. `NGINX_ENVSUBST_FILTER=STORAGE_CSP_ORIGIN` in that compose file limits
# substitution to exactly one name, so nginx's own `$uri` and `$csp_policy`
# variables below are left alone.
#
# `${STORAGE_CSP_ORIGIN}` is the browser-visible ORIGIN of the object store —
# scheme, host and port, nothing else (e.g. `https://s3.eu-west-1.amazonaws.com`
# or `http://localhost:9000` for MinIO). It is set in infra/compose/.env beside
# S3_ENDPOINT / S3_BUCKET / S3_REGION, which is where an operator already
# configures storage. Unset, it expands to nothing and every directive below
# reads exactly as it did before this mechanism existed — a deployment that
# uploads nothing needs no value.
#
# ⚠ NEVER A WILDCARD. `connect-src *` would let any compromised script in this
# app exfiltrate to any host on the internet, which is most of what CSP is for.
# Name the one origin the bucket is actually served from.
# =============================================================================

map $uri $csp_policy {
    # ---------------------------------------------------------------------
    # Default: the application itself.
    #
    #   script-src is 'self' only. A production build emits no inline
    #     scripts, so nothing legitimate needs 'unsafe-inline' here.
    #   style-src allows 'unsafe-inline' because MUI/emotion injects styles
    #     at runtime; removing it requires migrating to nonce-based styles.
    #   img-src allows https: because avatars come from Google
    #     (lh3.googleusercontent.com) and uploaded images are served from a
    #     configurable S3 endpoint, which may be AWS or MinIO.
    #   connect-src is 'self' plus ${STORAGE_CSP_ORIGIN}. The frontend talks
    #     to /api same-origin, but a resumable upload PUTs its parts DIRECTLY
    #     to the object store using a presigned URL the API minted — the bytes
    #     deliberately never pass through this proxy (a multi-GB upload
    #     through the API would hold a Node process for the length of the
    #     upload). Without the storage origin here the browser blocks every
    #     part PUT, and the failure surfaces as an opaque network error with
    #     no CORS or HTTP status to read.
    #   media-src is 'self' plus ${STORAGE_CSP_ORIGIN}, for the same reason in
    #     the other direction: `<audio src="<signed url>">` loads from the
    #     bucket, not from this origin. Absent the directive it falls back to
    #     default-src 'self' and playback of an uploaded recording fails
    #     silently. Bucket CORS must also allow the `Range` request header —
    #     see docs/runbooks/s3-cors.md.
    #   worker-src and manifest-src are explicit for PWA support (issue #220).
    #     default-src 'self' covers both in spec-compliant browsers, but Safari
    #     has historically required manifest-src spelled out. Being explicit
    #     protects against future default-src changes silently breaking the PWA.
    # ---------------------------------------------------------------------
    default      "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ${STORAGE_CSP_ORIGIN}; media-src 'self' blob: ${STORAGE_CSP_ORIGIN}; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";

    # ---------------------------------------------------------------------
    # The Scalar API reference at /api/docs.
    #
    # apps/api/src/openapi/docs-page.ts loads the Scalar standalone bundle
    # from a CDN by design (DEFAULT_SCALAR_CDN, overridable via API_DOCS_CDN
    # for an air-gapped deployment) and bootstraps it from an inline
    # <script> block (buildDocsAuthScript) that exchanges the session cookie
    # for an access token before mounting. The default policy above blocks
    # all three, leaving the page a bare header bar.
    #
    #   script-src adds the CDN host and 'unsafe-inline'. The inline block
    #     interpolates a JSON config (the Scalar config object plus the
    #     resolved token), so its hash is not stable and a hash-based
    #     allowance would break whenever that config changes.
    #   style-src adds the CDN because the bundle ships its stylesheet there.
    #   font-src adds fonts.scalar.com — Scalar serves its Inter/mono webfonts
    #     from its own host, not from the CDN the bundle came from. Without it
    #     the reference still renders but falls back to system fonts.
    #   connect-src keeps 'self': the spec is fetched from /api/openapi.json
    #     and the session token from /api/auth/refresh, both same-origin. The
    #     CDN is not a fetch target.
    #
    # Deliberately scoped to this one path. An air-gapped deployment that sets
    # API_DOCS_CDN to a self-hosted bundle can drop the CDN host from here.
    # ---------------------------------------------------------------------
    ~^/api/docs  "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.scalar.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}
